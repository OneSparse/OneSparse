name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release/**'

  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run documentation regression and semantic unit tests
        run: ./test.sh
